[backdrop]
blur_intensity = 0.8
enabled = true
tint_intensity = 0.5

[bar]
order = [ "Default" ]

    [bar.Default]
    background_opacity = 0.8
    center = [ "media", "audio_visualizer" ]
    end = [
        "tray",
        "notifications",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "clock",
        "recorder",
        "control-center",
        "session"
    ]
    margin_edge = 5
    margin_ends = 200
    padding = 16
    radius = 16
    start = [
        "launcher",
        "windows_vm",
        "workspaces",
        "cpu",
        "temp",
        "sysmon",
        "ram",
        "network_tx",
        "network_rx",
        "active_window"
    ]
    thickness = 32
    widget_spacing = 16

        [bar.Default.monitor.DP-2]
        background_opacity = 0.0
        capsule = true
        capsule_border = "outline"
        capsule_padding = 24.0
        capsule_thickness = 1.0
        center = [ "workspaces" ]
        compositor_blur = false
        end = []
        reserve_space = false
        shadow = false
        smart_auto_hide = true
        start = []
        thickness = 48

            [bar.Default.monitor.DP-2.dead_zone.actions]
            right = "none"

[config]

