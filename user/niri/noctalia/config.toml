[notification]
background_opacity = 0.8
history_retention_hours = 24
width = 320

[osd]
background_opacity = 0.8
hide_delay_ms = 1500
orientation = "vertical"
position_vertical = "top_right"

[plugin_settings."kenn/keybind-cheatsheet"]
cheatsheet_placement = "attached"

[plugin_settings."noctalia/screen_recorder"]
audio_bitrate = 256
video_bitrate_mode = "vbr"
video_quality = "ultra"
video_source = "region"

[plugins]
enabled = [ "kenn/keybind-cheatsheet", "noctalia/screen_recorder" ]

[shell]
date_format = "%x %A"
external_ip_enabled = true
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "Default"
password_style = "random"
polkit_agent = true
settings_expand_all_groups = true
settings_window_translucent = true
time_format = "{:%H:%M:%S}"

    [shell.greeter_sync]
    auto_sync = true

    [shell.keyboard_layout.custom_labels]
    "Korean (101/104-key compatible)" = "Korean"

    [shell.launcher]
    category_icons_only = true
    layout = "simple"
    sort_by_usage = false

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots"
    remember_last_region = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl reboot --firmware-setup"
    countdown_seconds = 0.0
    enabled = true
    glyph = "memory"
    label = "UEFI로 재부팅"
    shortcut = "5"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.32999999262392521
    direction = "center"

[system.monitor]
cpu_poll_seconds = 2
gpu_poll_seconds = 2
memory_poll_seconds = 2
network_poll_seconds = 2

[templates.fcitx5-somni]
input_path = "~/.config/noctalia/templates/fcitx5-somni.conf"
output_path = "~/.local/share/fcitx5/themes/somni-noctalia/theme.conf"

[templates.niri-somni]
input_path = "~/.config/noctalia/templates/niri-somni.kdl"
output_path = "~/.config/niri/noctalia-somni.kdl"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
edge_smoothness = 0.4
transition = [ "honeycomb" ]
transition_duration = 2000
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 3600

[widget.active_window]
capsule = true
capsule_border = "outline"
capsule_opacity = 0.0
capsule_padding = 16
icon_size = 16
max_length = 200

[widget.audio_visualizer]
anchor = true
bands = 64
centered = false
color_2 = "tertiary"
mirrored = false
width = 300

    [widget.audio_visualizer.actions]
    left = "panel-toggle control-center media"

[widget.bluetooth]
show_label = true

[widget.clock]
format = "{:%H:%M:%S}"

[widget.cpu]
font_family = "IBM Plex Mono"
scale = 0.9

[widget.launcher]
custom_image = "~/.face"
glyph = "noctalia"
scale = 1.5

[widget.media]
album_art_only = true
art_size = 24
hide_when_idle = true
hide_when_no_media = true
rotate_album_art = true

[widget.network_rx]
font_family = "IBM Plex Mono"
network_speed_compact = true
scale = 0.9

[widget.network_tx]
font_family = "IBM Plex Mono"
network_speed_compact = true
scale = 0.9

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
font_family = "IBM Plex Mono"
scale = 0.9

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
font_family = "IBM Plex Mono"
scale = 0.9
stat = "gpu_usage"

[widget.temp]
font_family = "Noto Sans Mono"
scale = 0.9

[widget.windows_vm]
glyph = "brand-windows-filled"
tooltip = "Windows VM 시작"
type = "custom_button"

    [widget.windows_vm.actions]
    left = "exec pkexec virsh start WindowsVM"
    middle = "none"

[widget.workspaces]
label_source = "name"
labels_only_when_occupied = true
max_label_chars = 3
